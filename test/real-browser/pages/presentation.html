<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adversarial presentation</title>
<style>
  body { margin: 0; font-family: sans-serif; }
  [data-presentation] { min-height: 100vh; display: flex; flex-direction: column; outline: none; }
  [data-presentation-stage] { position: relative; flex: 1; min-height: 300px; }
  [data-presentation-stage] > div { position: absolute; width: 60px; height: 30px; border: 1px solid #333; }
  [data-presentation-mode="present"] [data-presentation-caption] { display: none; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="root" data-presentation data-presentation-mode="present">
  <header data-presentation-header><h1 data-presentation-header-title>How to Use This Skill to Make a Presentation</h1></header>
  <h2 id="title" data-presentation-step-title></h2>
  <div id="stage" data-presentation-stage></div>
  <p id="caption" data-presentation-caption></p>
  <nav id="progress" data-presentation-progress aria-label="Progress" data-step-index="0" data-step-count="9"></nav>
  <nav data-presentation-step-controls aria-label="Step navigation">
    <button id="prev" data-presentation-prev type="button">Previous</button>
    <button id="next" data-presentation-next type="button">Next</button>
  </nav>
</div>
<script>
// One page, sixteen behaviours. The server injects VARIANT and STEPS; nothing here
// is a candidate. Each variant isolates one judgment the evaluator must make.
const variant = window.VARIANT
const steps = window.STEPS
const root = document.getElementById('root')
const progress = document.getElementById('progress')
let index = 0
let mode = 'present'
let keysDead = false
// (g) is a correct deck whose root carries only its mode, with no root hook,
// as a real candidate built its presentation.
if (variant === 'g') root.removeAttribute('data-presentation')

// (h) and (i) are correct decks whose chrome carries no title hook the
// evaluator ranks first. (h) sets the step title in an unhooked header <span>
// beside an unhooked <strong> deck title in browse mode, and in an unhooked
// <strong> in present mode. (i) declares its mode only as data-mode, puts an
// unhooked step-title paragraph before an unhooked caption paragraph in its
// footer, and in present mode shows a footer title paragraph, carrying the
// present-title hook, whose step marker is a nested element.
// (h) also keeps a persistent list of every step title visible in its stage,
// as a table of contents might. (j) is (h) without the active step title: only
// that list exposes the titles, so it must not stand in for them.
// (k) is 215c3182 rep 1's footer: it declares its mode only as data-mode and
// shows a step-marker paragraph ("01 / 09 · era") and a hooked step-title
// heading in both modes, with a caption paragraph only in browse mode. (l) is
// (k) without the step-title heading: the marker must not stand in for it.
// (p) is cc572181 rep 1's chrome: it declares its mode only as data-mode, shows
// a header marker and the deck title in browse mode and the step title in
// present mode, and in present mode shows the deck title as an otherwise
// unhooked footer paragraph, where browse mode shows the caption.
const marked = variant === 'k' || variant === 'l'
const unhooked = variant === 'h' || variant === 'i' || variant === 'j' || marked || variant === 'p'
let footer = null
if (unhooked) {
  document.getElementById('title').remove()
  document.getElementById('caption').remove()
  root.querySelector('[data-presentation-header]').replaceChildren()
  footer = document.createElement('footer')
  footer.setAttribute('data-presentation-footer', '')
  root.insertBefore(footer, progress)
}

function renderUnhooked() {
  const step = steps[index]
  const marker = String(index + 1).padStart(2, '0')
  const header = root.querySelector('[data-presentation-header]')
  const element = (tag, text, attributes = {}) => {
    const node = document.createElement(tag)
    for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value)
    if (Array.isArray(text)) node.append(...text)
    else node.textContent = text
    return node
  }
  if (variant === 'h' || variant === 'j') {
    const active = variant === 'h' ? [step.title] : []
    header.replaceChildren(...(mode === 'browse'
      ? [element('span', `section · ${marker}`), element('strong', 'How to Use This Skill to Make a Presentation'), ...active.map((title) => element('span', title))]
      : [element('span', `section · ${marker}`), ...active.map((title) => element('strong', title))]))
    footer.replaceChildren(...(mode === 'browse' ? [element('p', step.caption, { 'data-presentation-caption': '' })] : []))
    return
  }
  if (variant === 'p') {
    header.replaceChildren(
      element('div', `the ask · ${marker}`, { 'data-presentation-marker': '' }),
      mode === 'browse'
        ? element('h1', 'How to Use This Skill to Make a Presentation', { 'data-presentation-title': '' })
        : element('h1', step.title, { 'data-presentation-step-title': '' }),
    )
    footer.replaceChildren(...(mode === 'browse'
      ? [element('h2', step.title, { 'data-presentation-step-title': '' }), element('p', step.caption, { 'data-presentation-caption': '' })]
      : [element('p', 'How to Use This Skill to Make a Presentation', { 'data-presentation-live-title': '' })]))
    return
  }
  if (marked) {
    header.replaceChildren(...(mode === 'browse'
      ? [element('h1', 'How to Use This Skill to Make a Presentation', { 'data-presentation-title': '' })]
      : []))
    footer.replaceChildren(
      element('p', `${marker} / ${String(steps.length).padStart(2, '0')} · the ask`, { 'data-presentation-marker': '' }),
      ...(variant === 'k' ? [element('h2', step.title, { 'data-presentation-step-title': '' })] : []),
      ...(mode === 'browse' ? [element('p', step.caption, { 'data-presentation-caption': '' })] : []),
    )
    return
  }
  header.replaceChildren(...(mode === 'browse'
    ? [element('div', 'How to Use This Skill to Make a Presentation', { 'data-presentation-title': '' })]
    : []))
  footer.replaceChildren(...(mode === 'browse'
    ? [element('p', step.title, { class: 'step-title' }), element('p', step.caption, { class: 'caption' })]
    : [element('p', [element('span', marker), ` ${step.title}`], { 'data-presentation-present-title': '' })]))
}

function render() {
  if (variant === 'i' || marked || variant === 'p') {
    root.removeAttribute('data-presentation-mode')
    root.setAttribute('data-mode', mode)
  } else {
    root.setAttribute('data-presentation-mode', mode)
  }
  progress.setAttribute('data-step-index', String(index))
  if (unhooked) {
    renderUnhooked()
  } else {
    const title = document.getElementById('title')
    title.textContent = steps[index].title
    // (d) hides the one thing a reader must see in present mode.
    title.classList.toggle('hidden', variant === 'd' && mode === 'present')
    document.getElementById('caption').textContent = steps[index].caption
  }
  const stage = document.getElementById('stage')
  stage.replaceChildren()
  // (c) is a correct evolving scene whose hook no evaluator recognises.
  const hook = variant === 'c' ? 'data-unrecognised-thing' : 'data-layout-id'
  for (const id of ['stage-anchor', ...steps.slice(0, index + 1).map((_, n) => `card-${n}`)]) {
    const entity = document.createElement('div')
    entity.setAttribute(hook, id)
    entity.style.left = `${(id === 'stage-anchor' ? 0 : Number(id.slice(5)) + 1) * 70}px`
    stage.append(entity)
  }
  // The list sits inside the stage region, so its spans are title-bearing text.
  if (variant === 'h' || variant === 'j') {
    const list = document.createElement('p')
    list.style.cssText = 'margin: 0; font-size: 10px;'
    list.append(...steps.map(({ title }) => {
      const item = document.createElement('span')
      item.textContent = title
      item.style.marginRight = '8px'
      return item
    }))
    stage.prepend(list)
  }
  // Buttons are created once and updated in place, as a real app keeps its
  // nodes: recreating them would silently drop focus from the activated control.
  if (progress.children.length === 0) {
    progress.append(...steps.map((step, n) => {
      const dot = document.createElement('button')
      dot.type = 'button'
      dot.setAttribute('data-presentation-progress-dot', '')
      dot.setAttribute('aria-label', `Step ${n + 1}: ${step.title}`)
      dot.addEventListener('click', () => { keysDead ||= variant === 'b'; go(n) })
      if (variant === 'f') dot.addEventListener('blur', () => dot.focus())
      return dot
    }))
  }
  ;[...progress.children].forEach((dot, n) => {
    if (n === index) dot.setAttribute('aria-current', 'step')
    else dot.removeAttribute('aria-current')
  })
}

function go(next) {
  index = Math.max(0, Math.min(steps.length - 1, next))
  render()
}

function onKey(event) {
  if (event.key === 'p') { mode = mode === 'present' ? 'browse' : 'present'; render(); return }
  // "Controls keep their keys": a focused control drives itself, not the deck.
  if (event.target.closest('button')) return
  // (b) is the real defect: once a control was used, deck keys never come back.
  if (keysDead) return
  if (['ArrowRight', 'PageDown', ' '].includes(event.key)) go(index + 1)
  if (['ArrowLeft', 'PageUp'].includes(event.key)) go(index - 1)
}

// (e) listens on its own root only, so it needs focus inside the presentation.
if (variant === 'e') {
  root.setAttribute('tabindex', '-1')
  root.addEventListener('keydown', onKey)
  root.focus()
} else {
  document.addEventListener('keydown', onKey)
}
for (const [id, delta] of [['prev', -1], ['next', 1]]) {
  document.getElementById(id).addEventListener('click', () => { keysDead ||= variant === 'b'; go(index + delta) })
}
// (m) keeps the touch start in state that is only committed after the next
// frame, as React's setState is: a touchend delivered in the same task as its
// touchstart still sees no start. A real finger's swipe spans many frames.
// (n) has no swipe support at all. (o) listens for touches on its stage only,
// as a real candidate did, so only a touch landing on the stage reaches it.
let touchStart = null
const touchTarget = variant === 'o' ? document.getElementById('stage') : root
if (variant !== 'n') {
  touchTarget.addEventListener('touchstart', (event) => {
    const x = event.touches[0].clientX
    if (variant === 'm') requestAnimationFrame(() => { touchStart = x })
    else touchStart = x
  })
  touchTarget.addEventListener('touchend', (event) => {
    if (touchStart === null) return
    const delta = event.changedTouches[0].clientX - touchStart
    if (Math.abs(delta) > 40) go(index + (delta < 0 ? 1 : -1))
    touchStart = null
  })
}
render()
</script>
</body>
</html>
