  - id: packages-omit-prioritized-evidence
    file: internal/devaudit/value_audit.go
    line_range:
      - 493
      - 493
    description: Leaf package bounding includes only reference IDs and drops them by size, omitting
      required prioritized detailed evidence from metrics, Git, validation, artifacts, and narrative
      output.
    code_snippet: |-
      func boundLeafDetail(leaf LeafEvidence) LeafEvidence {
      	result := leaf
      	result.Evidence = append([]EvidenceReference(nil), leaf.Evidence...)
      	for len(result.Evidence) > 0 && encodedJSONBytes(result) > defaultLeafDetailBytes {
      		result.Evidence = result.Evidence[:len(result.Evidence)-1]
      	}
      }
    category: bug
    difficulty: hard
    priority: critical
    source: 2026-09-01 agent-runner
