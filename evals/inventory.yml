    description: Deferred-commit attribution compares ChangedPaths, but working-tree deltas never
      populate those paths, so later bulk commits cannot be matched and change statistics can be
      double counted.
    code_snippet: >-
      if !hasPathOverlap(leaves[prior].Skeleton.Git.ChangedPaths,
      leaves[index].Skeleton.Git.ChangedPaths) {
      	continue
      }

      leaves[prior].Skeleton.Git.Attribution = "deferred_commit"

      leaves[prior].Skeleton.Git.DeferredSHAs = append(leaves[prior].Skeleton.Git.DeferredSHAs,
      leaves[index].Skeleton.Git.CommitSHAs...)
    category: bug
    difficulty: hard
    priority: critical
